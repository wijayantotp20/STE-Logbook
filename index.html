<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STE Logbook - Aircraft Maintenance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        -webkit-tap-highlight-color: transparent;
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; font-size: 10pt; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #000 !important; padding: 4px 6px; text-align: left; font-size: 8pt; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md no-print">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="plane" class="w-6 h-6 text-blue-400"></i>
                <h1 class="font-bold text-lg tracking-wide">STE Logbook</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="exportToPDF()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                    <i data-lucide="printer" class="w-4 h-4"></i> Print/PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-6 no-print">

        <!-- Info / Profile Card -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Informasi Teknisi</h2>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <div>
                    <label class="text-xs text-slate-500">Nama Teknisi</label>
                    <input type="text" id="techName" placeholder="Nama Anda" class="w-full font-medium text-slate-800 bg-transparent border-b border-slate-200 focus:border-blue-500 outline-none text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-500">Kategori STE</label>
                    <p class="font-semibold text-slate-700 text-xs">Airframe - Powerplant</p>
                </div>
            </div>
        </div>

        <!-- Form Input Utama -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-4">
            <div class="border-b border-slate-100 pb-2 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 flex items-center gap-2 text-base">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Input Task Baru
                </h2>
                <span class="text-xs bg-blue-50 text-blue-600 font-medium px-2 py-0.5 rounded-full">CASR 65</span>
            </div>

            <!-- ATA Chapter (Bisa Diketik & Pilih Dropdown) -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ATA CHAPTER</label>
                <div class="flex gap-2">
                    <input type="text" id="ataInput" list="ataListOptions" placeholder="Ketik ATA (contoh: 05, 27)" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <datalist id="ataListOptions">
                        <!-- Options generated by JS -->
                    </datalist>
                    <button type="button" onclick="openSearchModal()" class="bg-slate-800 hover:bg-slate-900 text-white p-2.5 rounded-lg flex items-center justify-center shrink-0 shadow-sm transition" title="Cari ATA/Task">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">DESCRIPTION / TASK</label>
                <select id="descSelect" onchange="onDescChange()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none mb-2">
                    <!-- Options generated by JS -->
                </select>
                <input type="text" id="customDescInput" placeholder="Ketik deskripsi manual / detail pekerjaan..." class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Grid 2 Kolom: Code & Date -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">CODE</label>
                    <select id="codeSelect" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold">
                        <option value="P">P - Performed</option>
                        <option value="O">O - Observed</option>
                        <option value="S">S - Simulator</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">DATE</label>
                    <input type="date" id="dateInput" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- A/C Reg & Work Ref -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">A/C REG. & WORK REF.</label>
                <input type="text" id="workRefInput" placeholder="Contoh: PK-GAA / TC-24-001" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Verification Info -->
            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                <span class="text-xs font-bold text-slate-500 block">VERIFICATION (Atasan / Assessor)</span>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-500">ORGZ (Bisa Diketik)</label>
                        <input type="text" id="orgzInput" placeholder="Contoh: GMF / Lion" class="w-full bg-white border border-slate-300 text-slate-800 text-xs rounded p-1.5 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500">LIC. NO</label>
                        <input type="text" id="licNoInput" placeholder="No. Lisensi LAME" class="w-full bg-white border border-slate-300 text-slate-800 text-xs rounded p-1.5 outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="button" onclick="addEntry()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-xl shadow-md flex items-center justify-center gap-2 transition">
                <i data-lucide="save" class="w-5 h-5"></i> Simpan ke Logbook Table
            </button>
        </div>

        <!-- Tabel Rekap Data -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i data-lucide="list" class="w-4 h-4 text-blue-600"></i> Data Logbook (<span id="entryCount">0</span>)
                </h3>
                <button onclick="clearAllData()" class="text-xs text-red-500 hover:text-red-700 font-medium">Hapus Semua</button>
            </div>

            <div id="entriesList" class="space-y-2">
                <!-- Log entries will be rendered here dynamically -->
            </div>
        </div>

    </main>

    <!-- Modal Search Fast ATA -->
    <div id="searchModal" class="fixed
